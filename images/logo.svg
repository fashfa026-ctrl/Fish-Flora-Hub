<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 60" width="260" height="60">
  <defs>
    <linearGradient id="logoGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#20B8B0"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <linearGradient id="leafGradDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#20B8B0"/>
    </linearGradient>
  </defs>
  <!-- Fish Icon with Plant Leaf Tail & Glowing Ring -->
  <g transform="translate(10, 8)">
    <circle cx="22" cy="22" r="21" fill="#0A1C30" stroke="#20B8B0" stroke-width="1.8"/>
    <!-- Fish Body -->
    <path d="M 12 22 Q 22 13 32 22 Q 22 31 12 22 Z" fill="url(#logoGradDark)" />
    <!-- Tail (Plant Leaf Shape) -->
    <path d="M 14 22 C 7 14 5 17 8 22 C 5 27 7 30 14 22 Z" fill="url(#leafGradDark)" />
    <!-- Eye -->
    <circle cx="28" cy="20" r="1.8" fill="#071524" />
    <circle cx="28.5" cy="19.5" r="0.7" fill="#FFFFFF" />
    <!-- Plant stem & leaves curling up -->
    <path d="M 22 30 Q 30 36 34 27" fill="none" stroke="#4ade80" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 33 27 Q 37 25 35 30 Z" fill="#22c55e" />
    <!-- Air bubbles -->
    <circle cx="33" cy="14" r="1.6" fill="#20B8B0" opacity="0.9"/>
    <circle cx="36" cy="10" r="2.3" fill="#20B8B0" opacity="0.8"/>
  </g>
  <!-- Text for Dark Backgrounds (Pure White & Vibrant Green/Turquoise) -->
  <text x="65" y="29" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="800" fill="#FFFFFF" letter-spacing="-0.3">
    Fish <tspan fill="#20B8B0">&amp;</tspan> <tspan fill="#4ade80">Flora</tspan> Hub
  </text>
  <text x="66" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="600" fill="#94A3B8" letter-spacing="0.8">
    AQUARIUMS • PLANTS • CARE
  </text>
</svg>
