<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" fill="#08192a" rx="10"/>
  <g transform="translate(160, 95)">
    <!-- Light Bar -->
    <rect x="-110" y="-12" width="220" height="24" rx="5" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- LED Diodes -->
    <circle cx="-80" cy="0" r="4" fill="#ffffff" filter="drop-shadow(0px 0px 4px #ffffff)"/>
    <circle cx="-50" cy="0" r="4" fill="#38bdf8" filter="drop-shadow(0px 0px 4px #38bdf8)"/>
    <circle cx="-20" cy="0" r="4" fill="#ffffff" filter="drop-shadow(0px 0px 4px #ffffff)"/>
    <circle cx="10" cy="0" r="4" fill="#f43f5e" filter="drop-shadow(0px 0px 4px #f43f5e)"/>
    <circle cx="40" cy="0" r="4" fill="#22c55e" filter="drop-shadow(0px 0px 4px #22c55e)"/>
    <circle cx="70" cy="0" r="4" fill="#ffffff" filter="drop-shadow(0px 0px 4px #ffffff)"/>
    <!-- Adjustable Metal Stands -->
    <line x1="-105" y1="12" x2="-115" y2="45" stroke="#94a3b8" stroke-width="3"/>
    <line x1="105" y1="12" x2="115" y2="45" stroke="#94a3b8" stroke-width="3"/>
    <!-- Light Glow downwards -->
    <polygon points="-90,12 90,12 120,95 -120,95" fill="#38bdf8" opacity="0.15"/>
  </g>
</svg>