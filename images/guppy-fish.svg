<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgAqua2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a2540"/>
      <stop offset="100%" stop-color="#061524"/>
    </linearGradient>
    <linearGradient id="guppyTail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bgAqua2)" rx="10"/>
  <!-- Guppy -->
  <g transform="translate(160, 115)">
    <!-- Giant Fan Tail -->
    <path d="M -40 0 C -110 -65 -150 -30 -145 25 C -150 80 -100 85 -40 10 Z" fill="url(#guppyTail)"/>
    <!-- Spotted pattern on tail -->
    <circle cx="-90" cy="0" r="4.5" fill="#fde047" opacity="0.8"/>
    <circle cx="-110" cy="20" r="5" fill="#3b82f6" opacity="0.8"/>
    <circle cx="-120" cy="-10" r="4" fill="#10b981" opacity="0.8"/>
    <circle cx="-80" cy="30" r="3.5" fill="#fde047" opacity="0.8"/>
    <!-- Dorsal Fin -->
    <path d="M -15 -10 C -10 -45 20 -40 25 -10 Z" fill="#f59e0b" opacity="0.9"/>
    <!-- Slender Body -->
    <ellipse cx="0" cy="2" rx="42" ry="13" fill="#0284c7"/>
    <ellipse cx="18" cy="1" rx="22" ry="11" fill="#38bdf8"/>
    <!-- Eye -->
    <circle cx="32" cy="-1" r="3.8" fill="#070e17"/>
    <circle cx="33.5" cy="-2.5" r="1.3" fill="#ffffff"/>
  </g>
</svg>