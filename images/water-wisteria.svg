<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" fill="#061f1a" rx="10"/>
  <!-- Lacy branched leaves -->
  <g transform="translate(160, 200)">
    <line x1="0" y1="0" x2="0" y2="-160" stroke="#15803d" stroke-width="3"/>
    <!-- Leaf pairs branching out -->
    <path d="M 0 -40 Q -35 -50 -55 -40 M 0 -40 Q 35 -50 55 -40" stroke="#22c55e" stroke-width="3" fill="none"/>
    <path d="M 0 -80 Q -45 -95 -70 -80 M 0 -80 Q 45 -95 70 -80" stroke="#4ade80" stroke-width="3.5" fill="none"/>
    <path d="M 0 -120 Q -40 -140 -60 -125 M 0 -120 Q 40 -140 60 -125" stroke="#22c55e" stroke-width="3" fill="none"/>
    <polygon points="0,-160 -15,-150 0,-175 15,-150" fill="#86efac"/>
  </g>
</svg>