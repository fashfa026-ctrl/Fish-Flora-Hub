<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" fill="#091c2f" rx="10"/>
  <!-- Canister Filter -->
  <g transform="translate(160, 115)">
    <!-- Canister Body -->
    <rect x="-45" y="-55" width="90" height="115" rx="12" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <!-- Locking Clips -->
    <rect x="-50" y="-30" width="7" height="25" rx="3" fill="#0284c7"/>
    <rect x="43" y="-30" width="7" height="25" rx="3" fill="#0284c7"/>
    <!-- Canister Top Head -->
    <rect x="-42" y="-70" width="84" height="20" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <!-- Inlet and Outlet Taps -->
    <circle cx="-20" cy="-75" r="7" fill="#0284c7"/>
    <circle cx="20" cy="-75" r="7" fill="#22c55e"/>
    <!-- Hoses -->
    <path d="M -20 -82 Q -30 -105 -50 -100" stroke="#0284c7" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 20 -82 Q 30 -105 50 -100" stroke="#22c55e" stroke-width="6" fill="none" stroke-linecap="round"/>
    <!-- Power / Status LED -->
    <circle cx="0" cy="-10" r="4.5" fill="#20B8B0" filter="drop-shadow(0px 0px 4px #20B8B0)"/>
  </g>
</svg>