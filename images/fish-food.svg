<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" fill="#0a2036" rx="10"/>
  <g transform="translate(160, 115)">
    <!-- Canister Body -->
    <rect x="-35" y="-60" width="70" height="120" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Screw Lid -->
    <rect x="-38" y="-72" width="76" height="16" rx="4" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Label -->
    <rect x="-34" y="-35" width="68" height="75" fill="#f59e0b"/>
    <!-- Fish Silhouette on Label -->
    <path d="M -15 0 Q 0 -10 15 0 Q 0 10 -15 0 Z" fill="#0f172a"/>
    <polygon points="-15,0 -24,-6 -24,6" fill="#0f172a"/>
    <!-- Text Badge -->
    <rect x="-24" y="16" width="48" height="12" rx="3" fill="#0f172a"/>
    <text x="0" y="25" font-family="sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">FLAKES</text>
  </g>
</svg>