<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <defs>
    <linearGradient id="bgAqua8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0d2842"/>
      <stop offset="100%" stop-color="#061523"/>
    </linearGradient>
    <linearGradient id="swordGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <rect width="320" height="220" fill="url(#bgAqua8)" rx="10"/>
  <!-- Swordtail -->
  <g transform="translate(170, 115)">
    <!-- Tail + Distinctive Bottom Sword -->
    <polygon points="-40,-5 -75,-25 -65,-5 -40,5" fill="#f97316"/>
    <!-- Sword blade -->
    <polygon points="-40,5 -125,25 -40,12" fill="#0f172a"/>
    <polygon points="-40,6 -120,24 -40,11" fill="#ea580c"/>
    <!-- Dorsal Fin -->
    <polygon points="-10,-12 15,-30 18,-12" fill="#f97316"/>
    <!-- Streamlined Body -->
    <ellipse cx="0" cy="0" rx="44" ry="14" fill="url(#swordGrad)"/>
    <!-- Midline stripe -->
    <line x1="-30" y1="0" x2="35" y2="0" stroke="#c2410c" stroke-width="2"/>
    <!-- Eye -->
    <circle cx="30" cy="-2" r="4" fill="#0f172a"/>
    <circle cx="31.5" cy="-3.5" r="1.3" fill="#ffffff"/>
  </g>
</svg>