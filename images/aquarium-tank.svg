<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220">
  <rect width="320" height="220" fill="#0a1f33" rx="10"/>
  <!-- Rimless Glass Tank 3D perspective -->
  <g transform="translate(160, 110)">
    <!-- Base mat -->
    <rect x="-105" y="55" width="210" height="10" rx="3" fill="#020617"/>
    <!-- Glass body -->
    <rect x="-100" y="-60" width="200" height="115" rx="4" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.9"/>
    <!-- Water level -->
    <rect x="-97" y="-35" width="194" height="88" fill="#0284c7" opacity="0.3"/>
    <line x1="-98" y1="-35" x2="98" y2="-35" stroke="#7dd3fc" stroke-width="2" stroke-dasharray="6 2"/>
    <!-- Glass reflection highlights -->
    <polygon points="-75,-55 -60,-55 50,50 35,50" fill="#ffffff" opacity="0.12"/>
    <polygon points="-50,-55 -40,-55 70,50 60,50" fill="#ffffff" opacity="0.08"/>
  </g>
</svg>